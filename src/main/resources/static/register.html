<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="tailwind.generated.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><title>Register | PayTaxiHub</title><link rel="stylesheet" href="professional.css?v=2"><link rel="icon" href="pth-monogram.svg"></head><body class="bg-gray-100"><nav class="pth-nav"><div class="pth-nav-inner"><a href="index.html" class="pth-logo"><img class="pth-logo-mark" src="pth-monogram.svg" alt="" aria-hidden="true">Pay<span>Taxi</span>Hub</a><ul class="pth-nav-links"><li><a href="index.html">Home</a></li><li><a href="about.html">About</a></li><li><a href="contact.html">Contact</a></li><li><a href="login.html" class="pth-nav-cta">Login</a></li></ul></div></nav><main class="pt-16"><section class="section"><div class="section-inner max-w-3xl"><div class="bg-white rounded-2xl shadow-lg p-8"><span class="verified-badge">CREATE ACCOUNT</span><h1 class="text-4xl font-extrabold mt-4">Join PayTaxiHub</h1><p class="text-gray-500 mt-2">Registration creates the correct database records for your selected role.</p><form id="registerForm" class="grid md:grid-cols-2 gap-4 mt-8" novalidate><div><label for="fullName" class="block text-sm font-bold mb-1">Full name</label><input id="fullName" name="fullName" autocomplete="name" required maxlength="100" class="secure-input p-3 rounded-lg w-full"></div><div><label for="phoneNumber" class="block text-sm font-bold mb-1">Phone number</label><input id="phoneNumber" name="phoneNumber" type="tel" autocomplete="tel" required pattern="^\+?[0-9]{9,15}$" class="secure-input p-3 rounded-lg w-full"></div><div><label for="registerEmail" class="block text-sm font-bold mb-1">Email</label><input id="registerEmail" name="email" type="email" autocomplete="email" required maxlength="254" class="secure-input p-3 rounded-lg w-full"></div><div><label for="registerRole" class="block text-sm font-bold mb-1">Role</label><select name="role" id="registerRole" required class="secure-input p-3 rounded-lg w-full"><option value="Commuter">Commuter</option><option value="Driver">Driver</option><option value="FleetOwner">Fleet Owner</option></select></div><div><label for="password" class="block text-sm font-bold mb-1">Password</label><input name="password" id="password" required minlength="9" maxlength="72" type="password" autocomplete="new-password" aria-describedby="pwHint" placeholder="9+ characters, letters &amp; numbers" class="secure-input p-3 rounded-lg w-full"><p class="text-xs text-gray-500 mt-1" id="pwHint">Must be longer than 8 characters and include letters and numbers.</p></div><div><label for="confirmPassword" class="block text-sm font-bold mb-1">Confirm password</label><input id="confirmPassword" required minlength="9" maxlength="72" type="password" autocomplete="new-password" class="secure-input p-3 rounded-lg w-full"></div><div id="driverFields" class="hidden md:col-span-2 grid md:grid-cols-2 gap-4"><div><label for="saIdNumber" class="block text-sm font-bold mb-1">SA ID number</label><input name="saIdNumber" id="saIdNumber" autocomplete="off" class="secure-input p-3 rounded-lg w-full"></div><div><label for="prdpNumber" class="block text-sm font-bold mb-1">PRDP number</label><input name="prdpNumber" id="prdpNumber" autocomplete="off" class="secure-input p-3 rounded-lg w-full"></div></div><div id="ownerFields" class="hidden md:col-span-2"><label for="companyName" class="block text-sm font-bold mb-1">Company / fleet name</label><input name="companyName" id="companyName" autocomplete="organization" class="secure-input p-3 rounded-lg w-full"></div><div id="registerError" class="hidden md:col-span-2" role="alert"></div><button id="registerBtn" class="btn-primary md:col-span-2" type="submit">Create Account</button></form></div></div></section></main><div id="toast-container"></div><script src="app_engine.js"></script><script>
const params=new URLSearchParams(location.search);const roleSelect=document.getElementById('registerRole');if(params.get('role'))roleSelect.value=normalizeRole(params.get('role'));function syncRole(){const r=roleSelect.value,df=document.getElementById('driverFields'),of=document.getElementById('ownerFields');df.classList.toggle('hidden',r!=='Driver');of.classList.toggle('hidden',r!=='FleetOwner');document.getElementById('saIdNumber').required=r==='Driver';document.getElementById('prdpNumber').required=r==='Driver';document.getElementById('companyName').required=r==='FleetOwner'}roleSelect.addEventListener('change',syncRole);syncRole();const registerForm=document.getElementById('registerForm');registerForm.setAttribute('autocomplete','off');window.addEventListener('pagehide',()=>clearFormValues(registerForm));window.addEventListener('pageshow',()=>clearFormValues(registerForm));registerForm.addEventListener('submit',async e=>{e.preventDefault();clearSession();const f=e.currentTarget,btn=document.getElementById('registerBtn'),err=document.getElementById('registerError'),fd=new FormData(f),payload=Object.fromEntries(fd.entries());err.className='hidden';if(payload.password!==document.getElementById('confirmPassword').value){err.className='notice error md:col-span-2';err.textContent='Passwords do not match.';return}if(payload.password.length<9||!/\d/.test(payload.password)||!/[A-Za-z]/.test(payload.password)){err.className='notice error md:col-span-2';err.textContent='Password must be at least 9 characters and contain letters and numbers.';return}btn.disabled=true;btn.textContent='Creating account…';try{const result=await registerUser(payload);setSession(result.user,result.token);clearFormValues(registerForm);toast('Account created successfully.','success');setTimeout(()=>goDashboard(result.user.role),300)}catch(ex){err.className='notice error md:col-span-2';err.textContent=ex.message}finally{btn.disabled=false;btn.textContent='Create Account'}});
</script></body></html>
