<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="tailwind.generated.css">
<title>Forgot Password | PayTaxiHub</title>
<link rel="stylesheet" href="professional.css?v=2"><link rel="icon" href="pth-monogram.svg"></head>
<body class="bg-gray-100">
<nav class="pth-nav"><div class="pth-nav-inner"><a href="index.html" class="pth-logo"><img class="pth-logo-mark" src="pth-monogram.svg" alt="" aria-hidden="true">Pay<span>Taxi</span>Hub</a><ul class="pth-nav-links"><li><a href="index.html">Home</a></li><li><a href="login.html">Login</a></li><li><a href="register.html" class="pth-nav-cta">Register</a></li></ul></div></nav>
<main class="pt-16"><section class="section min-h-[650px] flex items-center"><div class="max-w-lg w-full mx-auto bg-white rounded-2xl shadow-lg p-8">
<span class="verified-badge">ACCOUNT RECOVERY</span><h1 class="text-4xl font-extrabold mt-4">Forgot password?</h1><p class="text-gray-500 mt-2">Enter your account email to request a password reset. </p>
<form id="requestForm" class="mt-8 space-y-4" novalidate><label class="block text-sm font-bold">Email<input id="email" type="email" autocomplete="off" class="secure-input w-full p-3 rounded-lg mt-1"></label><div id="requestError" class="hidden" role="alert"></div><button id="requestBtn" class="btn-primary" type="submit">Create reset code</button></form>
<div id="codePanel" class="hidden mt-6 border rounded-xl p-5 bg-gray-50"><div class="text-sm font-bold">Local demo reset code</div><div id="resetCode" class="text-3xl font-mono font-extrabold tracking-widest mt-2"></div><p class="text-xs text-gray-500 mt-2">The code expires in 15 minutes.</p></div>
<form id="resetForm" class="hidden mt-6 space-y-4"><label class="block text-sm font-bold">Reset code<input id="code" inputmode="numeric" maxlength="6" required class="secure-input w-full p-3 rounded-lg mt-1"></label><label class="block text-sm font-bold">New password<input id="password" type="password" placeholder="9+ characters, letters &amp; numbers" minlength="9" maxlength="72" required class="secure-input w-full p-3 rounded-lg mt-1"></label><label class="block text-sm font-bold">Confirm new password<input id="confirmPassword" type="password" minlength="9" maxlength="72" required class="secure-input w-full p-3 rounded-lg mt-1"></label><div id="resetError" class="hidden" role="alert"></div><button id="resetBtn" class="btn-primary" type="submit">Reset password</button></form>
<p class="text-sm text-gray-500 mt-6"><a class="text-[#007A5E] font-bold" href="login.html">Back to login</a></p>
</div></section></main><div id="toast-container"></div><script src="app_engine.js"></script><script>
const requestForm=document.getElementById('requestForm'),resetForm=document.getElementById('resetForm');
requestForm.addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('requestBtn'),err=document.getElementById('requestError'),email=document.getElementById('email').value.trim().toLowerCase();err.className='hidden';if(!email||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err.className='notice error';err.textContent=email?'Please enter a valid email address.':'Please enter your email address.';return}btn.disabled=true;btn.textContent='Creating…';try{const r=await request('auth/forgot-password',{method:'POST',body:JSON.stringify({email})});if(r.resetCode&&r.demoOnly===true){document.getElementById('resetCode').textContent=r.resetCode;document.getElementById('code').value=r.resetCode;document.getElementById('codePanel').classList.remove('hidden');resetForm.classList.remove('hidden');toast('Local demo reset code created.','success')}else{err.className='notice success';err.textContent=r.message||'If an active account exists for that email, reset instructions will be provided.'}}catch(ex){err.className='notice error';err.textContent=ex.message}finally{btn.disabled=false;btn.textContent='Create reset code'}});
resetForm.addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('resetBtn'),err=document.getElementById('resetError'),email=document.getElementById('email').value.trim().toLowerCase(),code=document.getElementById('code').value.trim(),password=document.getElementById('password').value,confirm=document.getElementById('confirmPassword').value;err.className='hidden';if(password!==confirm){err.className='notice error';err.textContent='Passwords do not match.';return}btn.disabled=true;btn.textContent='Resetting…';try{const r=await request('auth/reset-password',{method:'POST',body:JSON.stringify({email,code,password})});toast(r.message,'success');setTimeout(()=>location.href='login.html',700)}catch(ex){err.className='notice error';err.textContent=ex.message}finally{btn.disabled=false;btn.textContent='Reset password'}});
</script></body></html>
