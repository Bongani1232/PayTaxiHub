spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/paytaxihub?serverTimezone=Africa/Johannesburg&sslMode=REQUIRED}
spring.datasource.username=${DB_USERNAME:paytaxihub_app}
spring.datasource.password=${DB_PASSWORD:ReplaceWithYourNewPassword!}
spring.jpa.hibernate.ddl-auto=none
# Keep table names exactly as in the entities/SQL (see PayTaxiNamingStrategy); columns stay snake_case.
spring.jpa.hibernate.naming.physical-strategy=com.paytaxihub.config.PayTaxiNamingStrategy
# Needed after RESET_AND_CREATE_PAYTAXIHUB.sql: tables exist but flyway_schema_history was dropped.
# Flyway then records V1 as already applied and continues with V2-V4. An empty database still runs V1 normally.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
server.port=8080
server.error.include-message=never
app.session.cookie-secure=${SESSION_COOKIE_SECURE:true}


spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Production HTTPS: provide a certificate keystore via environment variables.
server.ssl.enabled=${HTTPS_ENABLED:false}
server.ssl.protocol=TLS
server.ssl.enabled-protocols=TLSv1.3
server.ssl.key-store=${TLS_KEYSTORE:}
server.ssl.key-store-password=${TLS_KEYSTORE_PASSWORD:}
server.ssl.key-store-type=${TLS_KEYSTORE_TYPE:PKCS12}

# Disabled by default. Set RESET_CODE_EXPOSE=true only for isolated localhost demos without email/SMS delivery.
app.password-reset.expose-code=${RESET_CODE_EXPOSE:false}

# Fleet-owner MFA. Leave MFA_CODE empty to sign fleet owners in with email + password only.
# When set, fleet owners must enter this code after their password. Real per-user delivery (SMS/email/TOTP) needs a provider.
app.mfa.code=${MFA_CODE:}
